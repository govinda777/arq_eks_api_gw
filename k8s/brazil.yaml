---
apiVersion: v1
kind: Namespace
metadata:
  name: brazil
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brazil
  namespace: brazil
spec:
  selector:
    matchLabels:
      app: brazil
  replicas: 1
  template:
    metadata:
      labels:
        app: brazil
    spec:
      containers:
      - image: marcosouzatech/items-api:latest
        name: brazil
        env:
          - name: APP_NAME
            valueFrom:
              configMapKeyRef:
                name: configmap-api
                key: APP_NAME
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: configmap-api
                key: DB_PORT
          - name: DB_NOME
            valueFrom:
              configMapKeyRef:
                name: configmap-api
                key: DB_NOME
          - name: DB_URL
            valueFrom:
              configMapKeyRef:
                name: configmap-api
                key: DB_URL
          - name: DB_USUARIO
            valueFrom:
              configMapKeyRef:
                name: configmap-api
                key: DB_USUARIO
          - name: API_PORT
            valueFrom:
              configMapKeyRef:
                name: configmap-api
                key: API_PORT
          - name: DB_SENHA
            valueFrom:
              secretKeyRef:
                name: secret-db-api
                key: DB_SENHA
---
apiVersion: v1
kind: Service
metadata:
  name: brazil
  namespace: brazil
spec:
  ports:
  - targetPort: 9000
    port: 3002
    nodePort: 30002
    protocol: TCP
  type: NodePort
  selector:
    app: brazil
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-api
  namespace: brazil
data:
  APP_NAME: "brazil"
  DB_PORT: "3306"
  DB_USUARIO: "root"
  DB_URL: "mysql.database.svc.cluster.local"
  DB_NOME: "brasil"
  API_PORT: "9000"
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-db-api
  namespace: brazil
type: Opaque
data:
  DB_SENHA: cm9vdHBhc3N3b3Jk

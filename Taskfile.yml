version: '3'

tasks:
  cluster-up:
    desc: Create a local Kubernetes cluster using Kind
    cmds:
      - kind create cluster --name items-api-cluster
    status:
      - kind get clusters | grep items-api-cluster

  build:
    desc: Build the Docker image
    cmds:
      - docker build -t marcosouzatech/items-api:latest .

  load:
    desc: Load the Docker image into the Kind cluster
    cmds:
      - kind load docker-image marcosouzatech/items-api:latest --name items-api-cluster

  deploy:
    desc: Deploy the application and database to the cluster
    deps: [build, load]
    cmds:
      - kubectl apply -f k8s/mysql.yaml
      - kubectl create configmap mysql-init-config --from-file=items-api/sql/sql.sql -n database --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f k8s/argentina.yaml
      - kubectl apply -f k8s/brazil.yaml
      - kubectl apply -f k8s/colombia.yaml
      - kubectl apply -f k8s/mexico.yaml

  verify:
    desc: Verify that the cluster is up and services are running
    cmds:
      - kubectl get pods -A
      - kubectl get svc -A
      - echo "Waiting for pods to be ready..."
      - kubectl wait --for=condition=ready pod -l app=mysql -n database --timeout=120s
      - kubectl wait --for=condition=ready pod -l app=brazil -n brazil --timeout=120s
      - echo "Checking health of Brazil service..."
      - |
        POD_NAME=$(kubectl get pods -n brazil -l app=brazil -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n brazil $POD_NAME -- curl -s localhost:9000/
    ignore_error: true

  cluster-down:
    desc: Destroy the local Kubernetes cluster
    cmds:
      - kind delete cluster --name items-api-cluster

  test:
    desc: Run unit tests
    cmds:
      - cd items-api && go test ./...
